name: Quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Bash syntax and ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Bash syntax
        run: bash -n vps.sh

      - name: Test APT simulation parser
        run: |
          source ./vps.sh
          actual="$(
            printf '%s\n' \
              'Remv unused-package [1.0]' \
              'Purg old-kernel [6.12]' \
              'Inst unrelated-package (2.0 stable [amd64])' |
              parse_apt_simulated_removals
          )"
          expected=$'unused-package\nold-kernel'
          test "$actual" = "$expected"

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Run ShellCheck
        run: shellcheck --severity=error vps.sh
