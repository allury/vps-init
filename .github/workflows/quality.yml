name: Quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Bash syntax and ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Bash syntax
        run: bash -n vps.sh tests/test-apt-simulation-parser.sh tests/test-logging.sh

      - name: Test APT simulation parser
        run: bash tests/test-apt-simulation-parser.sh

      - name: Test diagnostic logging
        run: bash tests/test-logging.sh

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Run ShellCheck
        run: shellcheck --severity=error vps.sh tests/test-apt-simulation-parser.sh tests/test-logging.sh

  debian-13:
    name: Debian 13 Bash compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: debian:13-slim
    steps:
      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            bash ca-certificates git mawk shellcheck

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Bash syntax
        run: bash -n vps.sh tests/test-apt-simulation-parser.sh tests/test-logging.sh

      - name: Test APT simulation parser
        run: bash tests/test-apt-simulation-parser.sh

      - name: Test diagnostic logging
        run: bash tests/test-logging.sh

      - name: Run ShellCheck
        run: shellcheck --severity=error vps.sh tests/test-apt-simulation-parser.sh tests/test-logging.sh
