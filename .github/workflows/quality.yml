name: Quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debian:
    name: ${{ matrix.name }} syntax, offline tests and ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12
            image: debian:12-slim
          - name: Debian 13
            image: debian:13-slim
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install test dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update \
            -o Acquire::Retries=3 \
            -o APT::Update::Error-Mode=any
          apt-get install --yes --no-install-recommends \
            bash ca-certificates coreutils findutils git grep iproute2 mawk procps sed shellcheck util-linux

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check Bash syntax
        run: bash -n vps.sh tests/*.sh

      - name: Run test suite
        run: |
          for test_file in tests/test-*.sh; do
            echo "Running ${test_file}"
            bash "${test_file}"
          done

      - name: Run ShellCheck
        run: shellcheck --severity=error vps.sh tests/*.sh
