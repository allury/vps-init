name: Release

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
    paths:
      - ".github/releases/*.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish, for example 1.2.2
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            tag="$REF_NAME"
          else
            tag=$(sed -n 's/^VERSION="\([^"]*\)"/\1/p' vps.sh)
          fi

          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi

          notes_file=".github/releases/${tag}.md"
          if [[ ! -f "$notes_file" ]]; then
            echo "Release notes not found: $notes_file" >&2
            exit 1
          fi

          if ! git rev-parse --verify "refs/tags/${tag}^{commit}" >/dev/null; then
            if [[ "$EVENT_NAME" == "push" && "$REF_TYPE" == "branch" ]]; then
              echo "Release tag has not been pushed yet; waiting for tag: $tag"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Git tag does not exist: $tag" >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == "push" && "$REF_TYPE" == "branch" ]]; then
            tag_commit=$(git rev-parse "refs/tags/${tag}^{commit}")
            current_commit=$(git rev-parse HEAD)
            if [[ "$tag_commit" != "$current_commit" ]]; then
              echo "Release tag $tag does not point to the current commit; waiting for tag update."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create or synchronize Release
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: ${{ steps.release.outputs.notes_file }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "vps-init $TAG" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "vps-init $TAG" \
              --notes-file "$NOTES_FILE"
          fi
