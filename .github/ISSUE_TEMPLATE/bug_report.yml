name: Bug 报告
description: 报告可复现的脚本错误
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先删除日志中的 IP、密钥、令牌等敏感信息。安全漏洞请使用私密漏洞报告。
  - type: input
    id: os
    attributes:
      label: 操作系统
      description: 例如 Debian 13 或 Ubuntu 24.04
      placeholder: Debian 13
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: 脚本版本
      description: 提交 SHA 或下载日期
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请说明执行的菜单项、预期结果和实际结果。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 运行……
        2. 选择……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已在最新 main 上复现。
          required: true
        - label: 我已删除所有敏感信息。
          required: true
        - label: 这不是应私下报告的安全漏洞。
          required: true
